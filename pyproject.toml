[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paretopilot"
version = "0.1.0"
description = "A deterministic synthetic multi-objective planning lab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JStar" }]
dependencies = []

[project.scripts]
paretopilot = "paretopilot.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paretopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
